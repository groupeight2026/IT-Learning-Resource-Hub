", "Open Textbook Library", "https://open.umn.edu/opentextbooks/textbooks/1500"], ["Digital Electronics", "Wikibooks", "https://en.wikibooks.org/wiki/Digital_Electronics"]], "digital-communication": [["Digital communications", "OpenLearn - The Open University", "https://www.open.edu/openlearn/digital-computing/digital-communications"], ["Exploring communications technology", "OpenLearn - The Open University", "https://www.open.edu/openlearn/digital-computing/exploring-communications-technology/content-section-0"]], "dbms": [["Database Design - 2nd Edition", "Open Textbook Library", "https://open.umn.edu/opentextbooks/textbooks/database-design-2nd-edition"], ["Database concepts and design resources", "Open Textbook Library", "https://open.umn.edu/opentextbooks/subjects/information-systems"]], "data-structure": [["Open Data Structures: An Introduction", "Open Textbook Library", "https://open.umn.edu/opentextbooks/textbooks/open-data-structures-an-introduction"], ["An Open Guide to Data Structures and Algorithms", "Open Textbook Library", "https://open.umn.edu/opentextbooks/textbooks/an-open-guide-to-data-structures-and-algorithms"]] }; const names = { "cpp": "C++", "csharp": "C#", "java": "Java", "html": "HTML", "css": "CSS", "circuit": "Circuit", "digital-electronics": "Digital Electronics", "digital-communication": "Digital Communication", "dbms": "Database Management Systems", "data-structure": "Data Structure" }; const icons = { "cpp": "assets/cpp.svg", "csharp": "assets/csharp.svg", "java": "assets/java.svg", "html": "assets/html.svg", "css": "assets/css.svg", "circuit": "assets/circuit.svg", "digital-electronics": "assets/digital-electronics.svg", "digital-communication": "assets/digital-communication.svg", "dbms": "assets/dbms.svg", "data-structure": "assets/data-structure.svg" }; const k = new URLSearchParams(location.search).get('topic') || 'cpp'; const list = books[k] || books.cpp; let cards = list.map(b => `<a class="book-card" href="${b[2]}" target="_blank
